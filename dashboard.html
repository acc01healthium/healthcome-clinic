async function editDoctor(id) {

  const { data: doctor, error } = await db
    .from('healthcome_doctors')
    .select('*')
    .eq('id', id)
    .single();

  if (error) {
    alert('讀取醫師資料失敗：' + error.message);
    return;
  }

  for (const kind of ['Photo','Poster']) {document.getElementById('editDoctor'+kind+'File').value='';renderImagePreview(kind,doctor[kind==='Photo'?'photo_url':'poster_url']);}
  document.getElementById('editDoctorId').value = doctor.id;
  document.getElementById('editDoctorName').value = doctor.name || '';
  document.getElementById('editDoctorTitle').value = doctor.title || '';
  document.getElementById('editDoctorSpecialty').value = doctor.specialty || '';
  document.getElementById('editDoctorSlogan').value = doctor.slogan || '';
  document.getElementById('editDoctorEducation').value = doctor.education || '';
  document.getElementById('editDoctorExperience').value = doctor.experience || '';
  document.getElementById('editDoctorExpertise').value = doctor.expertise || '';
  document.getElementById('editDoctorPhotoUrl').value = doctor.photo_url || '';
  document.getElementById('editDoctorPosterUrl').value = doctor.poster_url || '';
  document.getElementById('editDoctorSortOrder').value = doctor.sort_order || '';
  document.getElementById('editDoctorActive').checked = doctor.is_active !== false;

  dirtyDoctor=false;setEditStatus('');document.getElementById('doctorEditModal').style.display='flex';document.getElementById('editDoctorName').focus();
}

async function uploadDoctorImage(file, folder) {
  if (!file) return null;

  if (!['image/jpeg','image/png','image/webp'].includes(file.type)) throw new Error('圖片需為 JPG、PNG 或 WebP 格式。');
  if (file.size > 5*1024*1024) throw new Error('圖片不可超過 5 MB。');
  // 檔名副檔名
  const extension = file.name.split('.').pop().toLowerCase();

  // 產生不重複檔名
  const fileName =
    folder + '/' +
    Date.now() + '-' +
    Math.random().toString(36).substring(2, 10) +
    '.' + extension;

  // 上傳到 Supabase Storage
  const { error: uploadError } = await db.storage
    .from('healthcome-images')
    .upload(fileName, file, {
      cacheControl: '3600',
      upsert: false
    });

  if (uploadError) {
    throw new Error('圖片上傳失敗：' + uploadError.message);
  }

  // 取得公開圖片網址
  const { data } = db.storage
    .from('healthcome-images')
    .getPublicUrl(fileName);

  return data.publicUrl;
}


async function saveDoctorEdit() {
  const saveButton=document.getElementById('saveDoctorButton');
  if(saveButton.disabled)return;
  const name=document.getElementById('editDoctorName').value.trim();
  const sort=Number(document.getElementById('editDoctorSortOrder').value);
  if(!name){setEditStatus('請輸入醫師姓名。',true);document.getElementById('editDoctorName').focus();return;}
  if(!Number.isSafeInteger(sort)||sort<0){setEditStatus('排序請輸入 0 或以上的整數。',true);return;}
  saveButton.disabled=true;saveButton.textContent='儲存中…';setEditStatus('正在儲存資料與圖片…');

  const id = document.getElementById('editDoctorId').value;

  const photoFile =
    document.getElementById('editDoctorPhotoFile').files[0];

  const posterFile =
    document.getElementById('editDoctorPosterFile').files[0];

  // 保留原本圖片網址
  let photoUrl =
    document.getElementById('editDoctorPhotoUrl').value;

  let posterUrl =
    document.getElementById('editDoctorPosterUrl').value;

  try {

    // 有選新照片才上傳
    if (photoFile) {
      photoUrl = await uploadDoctorImage(
        photoFile,
        'doctors'
      );
    }

    // 有選新海報才上傳
    if (posterFile) {
      posterUrl = await uploadDoctorImage(
        posterFile,
        'posters'
      );
    }

    const updateData = {
      name: document.getElementById('editDoctorName').value.trim(),
      title: document.getElementById('editDoctorTitle').value.trim(),
      specialty: document.getElementById('editDoctorSpecialty').value.trim(),
      slogan: document.getElementById('editDoctorSlogan').value.trim(),
      education: document.getElementById('editDoctorEducation').value.trim(),
      experience: document.getElementById('editDoctorExperience').value.trim(),
      expertise: document.getElementById('editDoctorExpertise').value.trim(),

      photo_url: photoUrl,
      poster_url: posterUrl,

      sort_order: Number(
        document.getElementById('editDoctorSortOrder').value
      ),

      is_active:
        document.getElementById('editDoctorActive').checked
    };

    const { data: savedDoctor, error } = await db.from('healthcome_doctors').update(updateData).eq('id',id).select('id').single();
    if(!error && !savedDoctor) throw new Error('資料未更新，請確認管理員的資料寫入權限。');

    if (error) {
      throw error;
    }

    document.getElementById('dashboardMessage').textContent='醫師資料已成功儲存。';dirtyDoctor=false;

    closeDoctorEditModal(true);

    doctorMenuButton.click();

  } catch (error) {

    console.error(error);

    setEditStatus('儲存失敗：'+error.message,true);

  } finally {saveButton.disabled=false;saveButton.textContent='儲存變更';}
}

function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setEditStatus(message,error=false){const el=document.getElementById('editStatus');el.textContent=message;el.style.color=error?'#b13b3b':'#358f7f';}
function renderImagePreview(kind,url){const el=document.getElementById('editDoctor'+kind+'Preview');el.replaceChildren();if(!url)return;try{const u=new URL(url,location.href);if(!['https:','http:','blob:'].includes(u.protocol))return;}catch{return;}const img=document.createElement('img');img.src=url;img.alt=kind==='Photo'?'醫師照片預覽':'醫師海報預覽';img.style.cssText='max-width:100%;max-height:220px;object-fit:contain;border-radius:8px';el.append(img);}
function filterDoctors(){const q=document.getElementById('doctorSearch').value.trim().toLowerCase();[...doctorList.children].forEach((el,i)=>{const d=cachedDoctors[i];if(d)el.hidden=!([d.name,d.title,d.specialty].join(' ').toLowerCase().includes(q));});}
document.getElementById('doctorSearch').addEventListener('input',filterDoctors);
document.getElementById('refreshDoctors').addEventListener('click',()=>doctorMenuButton.click());
document.getElementById('doctorEditModal').addEventListener('input',()=>dirtyDoctor=true);
for(const kind of ['Photo','Poster'])document.getElementById('editDoctor'+kind+'File').addEventListener('change',e=>{const file=e.target.files[0];if(previewObjectUrls[kind])URL.revokeObjectURL(previewObjectUrls[kind]);if(!file){renderImagePreview(kind,document.getElementById('editDoctor'+kind+'Url').value);return;}if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){e.target.value='';setEditStatus('請選擇 5 MB 以內的 JPG、PNG 或 WebP 圖片。',true);renderImagePreview(kind,document.getElementById('editDoctor'+kind+'Url').value);return;}previewObjectUrls[kind]=URL.createObjectURL(file);renderImagePreview(kind,previewObjectUrls[kind]);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('doctorEditModal').style.display==='flex')closeDoctorEditModal();});
window.addEventListener('beforeunload',e=>{if(dirtyDoctor){e.preventDefault();e.returnValue='';}});
document.querySelectorAll('#doctorEditModal label').forEach(label=>{const input=label.querySelector('input,textarea')||label.parentElement.querySelector('input:not([type=hidden]),textarea');if(input)label.htmlFor=input.id;});


const sectionNames={home:'首頁內容',services:'醫療服務',hours:'門診時間',news:'最新消息',contact:'基本設定'};
let selectedSection='home',contentValue={},contentDirty=false,contentSaving=false;
function field(label,id,value,textarea=false){return '<label for="'+id+'">'+escapeHtml(label)+'</label>'+(textarea?'<textarea rows="4" id="'+id+'">'+escapeHtml(value)+'</textarea>':'<input id="'+id+'" value="'+escapeHtml(value)+'">');}
async function showContent(section){if(contentSaving)return;if(contentDirty&&!confirm('尚有未儲存的修改，確定離開嗎？'))return;contentDirty=false;selectedSection=section;document.querySelectorAll('aside button').forEach(b=>b.classList.toggle('active',b.dataset.panel===section));welcomePanel.style.display='none';doctorPanel.style.display='none';document.getElementById('contentPanel').hidden=false;document.getElementById('contentTitle').textContent=sectionNames[section];document.getElementById('contentStatus').textContent='';const notice=document.getElementById('contentNotice');notice.textContent='正在讀取…';document.getElementById('saveContentButton').disabled=true;
try{const {data,error}=await db.from('healthcome_site_content').select('value').eq('key',section).maybeSingle();if(error)throw error;contentValue=clinicClone(data?.value||CLINIC_DEFAULTS[section]);notice.textContent='儲存成功後，訪客重新整理網站即可看到更新。';renderContent();document.getElementById('saveContentButton').disabled=false;}catch(error){contentValue=clinicClone(CLINIC_DEFAULTS[section]);renderContent();notice.textContent='內容管理資料庫尚未連接或無讀取權限。請完成資料庫設定後重新整理；目前顯示預設內容，尚無法儲存。';}}
function renderContent(){const v=contentValue;let html='';if(selectedSection==='home')html=field('主標題','contentTitleField',v.title,true)+field('介紹文字','contentDescription',v.description,true);if(selectedSection==='contact')html=field('電話','contentPhone',v.phone)+field('LINE 帳號','contentLine',v.line)+field('地址','contentAddress',v.address);if(selectedSection==='hours')html=field('早診','contentMorning',v.morning)+field('午診','contentAfternoon',v.afternoon)+field('晚診','contentEvening',v.evening)+field('週六、週日午診','contentWeekendAfternoon',v.weekendAfternoon||'14:30–18:00')+field('門診表註記','contentHoursNote',v.note||'週六、週日午診看到18:00；晚診休診。')+'<label class="check-label"><input id="contentWeekend" type="checkbox" '+(v.weekendEveningClosed?'checked':'')+'>週六、週日晚診休診</label>';if(selectedSection==='services')html=v.items.map((item,i)=>'<fieldset><legend>服務 '+(i+1)+'</legend>'+field('名稱','serviceTitle'+i,item.title)+field('說明','serviceDescription'+i,item.description)+'</fieldset>').join('');if(selectedSection==='news'){renderNewsEditor();return;}document.getElementById('contentFields').innerHTML=html;}
function readContent(){const val=id=>document.getElementById(id).value.trim();switch(selectedSection){case 'home':return {title:val('contentTitleField'),description:val('contentDescription')};case 'contact':return {phone:val('contentPhone'),line:val('contentLine'),address:val('contentAddress')};case 'hours':return {morning:val('contentMorning'),afternoon:val('contentAfternoon'),evening:val('contentEvening'),weekendAfternoon:val('contentWeekendAfternoon'),note:val('contentHoursNote'),weekendEveningClosed:document.getElementById('contentWeekend').checked};case 'services':return {items:Array.from({length:4},(_,i)=>({title:val('serviceTitle'+i),description:val('serviceDescription'+i)}))};case 'news':return readNewsEditor();}}
document.querySelectorAll('[data-panel]').forEach(button=>button.addEventListener('click',()=>showContent(button.dataset.panel)));
document.getElementById('contentForm').addEventListener('input',()=>contentDirty=true);
document.getElementById('contentForm').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('saveContentButton'),status=document.getElementById('contentStatus');if(button.disabled)return;const value=readContent();if(selectedSection==='news'&&value.items.some(item=>!item.title.trim())){status.textContent='每篇消息都需要標題；不使用的文章請按移除。';return;}if(selectedSection==='home'&&!value.title||selectedSection==='services'&&value.items.some(i=>!i.title)||selectedSection==='contact'&&(!value.phone||!value.address||!/^@?[a-zA-Z0-9._-]+$/.test(value.line))){status.textContent='請完整填寫必要欄位，LINE 帳號請填寫有效的 ID。';return;}if(selectedSection==='hours'&&[value.morning,value.afternoon,value.evening,value.weekendAfternoon].some(t=>!/^([01]\d|2[0-3]):[0-5]\d[–-]([01]\d|2[0-3]):[0-5]\d$/.test(t))){status.textContent='時段格式請使用 07:30–12:00。';return;}button.disabled=true;contentSaving=true;document.querySelectorAll('#contentFields input,#contentFields textarea,#contentFields button').forEach(el=>el.disabled=true);status.textContent='正在儲存…';try{if(selectedSection==='news')await uploadNewsImages(value);const {data,error}=await db.from('healthcome_site_content').upsert({key:selectedSection,value},{onConflict:'key'}).select('key').single();if(error)throw error;if(!data)throw new Error('未取得儲存結果');contentDirty=false;contentValue=value;if(selectedSection==='news')renderNewsEditor();status.textContent='儲存成功，網站內容已更新。';}catch(error){status.textContent='儲存失敗：'+error.message;}finally{contentSaving=false;button.disabled=false;document.querySelectorAll('#contentFields input,#contentFields textarea,#contentFields button').forEach(el=>el.disabled=false);}});
window.addEventListener('beforeunload',e=>{if(contentDirty){e.preventDefault();e.returnValue='';}});

checkLogin().catch(error=>{const loading=document.getElementById('loading');loading.textContent=error.message+' 請重新整理後再試。';});

</script>

<script src="news-admin.js"></script></body>
</html>
