<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>立康診所｜網站管理後台</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #f4f8f5;
      color: #24453d;
    }

    header {
      height: 72px;
      background: white;
      border-bottom: 1px solid #e2ebe7;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 35px;
    }

    .brand {
      font-size: 24px;
      font-weight: 700;
      color: #358f7f;
      letter-spacing: 3px;
    }

    .logout {
      border: 1px solid #358f7f;
      background: white;
      color: #358f7f;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 72px);
    }

    aside {
      width: 230px;
      background: #2f786b;
      padding: 25px 15px;
    }

    aside button {
      display: block;
      width: 100%;
      border: 0;
      background: transparent;
      color: white;
      text-align: left;
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 7px;
      font-size: 15px;
      cursor: pointer;
    }

    aside button:hover,
    aside button.active {
      background: rgba(255,255,255,.16);
    }

    main {
      flex: 1;
      padding: 40px;
    }

    .welcome {
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(36,69,61,.07);
    }

    .welcome h1 {
      margin-top: 0;
      color: #2f786b;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: #f4f8f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #358f7f;
      z-index: 999;
    }

    #dashboard {
      display: none;
    }
  </style>
</head>

<body>

<div id="loading">
  正在確認管理員身分...
</div>

<div id="dashboard">

  <header>
    <div class="brand">
      立康診所｜網站管理後台
    </div>

    <button class="logout" id="logoutButton">
      登出
    </button>
  </header>

  <div class="layout">

    <aside>
      <button class="active">首頁內容</button>
      <button id="doctorMenuButton">醫師團隊</button>
      <button>醫療服務</button>
      <button>門診時間</button>
      <button>最新消息</button>
      <button>基本設定</button>
    </aside>

<main>

  <div class="welcome" id="welcomePanel">
    <h1>歡迎進入立康診所網站管理後台</h1>

    <p id="adminEmail"></p>

    <p>
      請從左側選單選擇要管理的網站內容。
    </p>
  </div>

  <div id="doctorPanel" style="display:none;">
    <h1>醫師團隊管理</h1>
    <p>在這裡管理立康診所的醫師資料。</p>

    <div id="doctorList">
      正在讀取醫師資料...
    </div>
  </div>

</main>

  </div>

</div>


<script>

const SUPABASE_URL =
  'https://utwhtjtgwryeljgwlwzm.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_207N7AlFmADOQAdTxcahEg_iVAdw4KU';

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function checkLogin() {

  const {
    data: { session }
  } = await db.auth.getSession();

  if (!session) {
    window.location.href = 'admin.html';
    return;
  }

  const email = session.user.email;

  if (email !== 'acc.01.healthium@gmail.com') {

    await db.auth.signOut();

    window.location.href = 'admin.html';
    return;
  }

  document.getElementById('adminEmail').textContent =
    '目前登入帳號：' + email;

  document.getElementById('loading').style.display =
    'none';

  document.getElementById('dashboard').style.display =
    'block';
}


document
  .getElementById('logoutButton')
  .addEventListener('click', async function() {

    await db.auth.signOut();

    window.location.href = 'admin.html';

  });
const doctorMenuButton = document.getElementById('doctorMenuButton');
const welcomePanel = document.getElementById('welcomePanel');
const doctorPanel = document.getElementById('doctorPanel');
const doctorList = document.getElementById('doctorList');

doctorMenuButton.addEventListener('click', async function () {

  welcomePanel.style.display = 'none';
  doctorPanel.style.display = 'block';

  doctorList.innerHTML = '正在讀取醫師資料...';

  const { data: doctors, error } = await db
    .from('healthcome_doctors')
    .select('*')
    .order('sort_order', { ascending: true });

  if (error) {
    doctorList.innerHTML =
      '<p style="color:#d9534f;">讀取失敗：' + error.message + '</p>';
    return;
  }

  if (!doctors || doctors.length === 0) {
    doctorList.innerHTML = '<p>目前沒有醫師資料。</p>';
    return;
  }

  doctorList.innerHTML = doctors.map(function (doctor) {

    return `
      <div style="
        background:white;
        border:1px solid #e2ebe7;
        border-radius:12px;
        padding:18px;
        margin-bottom:12px;
      ">
        <div style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:20px;
        ">

          <div>
            <h3 style="margin:0 0 8px 0;">
              ${doctor.name || ''}
              <span style="
                font-size:14px;
                font-weight:normal;
                color:#718078;
              ">
                ${doctor.title || ''}
              </span>
            </h3>

            <div style="color:#358f7f;font-weight:600;">
              ${doctor.specialty || ''}
            </div>

            <div style="margin-top:6px;color:#6c7772;">
              ${doctor.slogan || ''}
            </div>
          </div>

          <div style="text-align:right;">
          <button
  onclick="editDoctor(${doctor.id})"
  style="
    padding:6px 14px;
    margin-bottom:8px;
    border:1px solid #358f7f;
    border-radius:6px;
    background:white;
    color:#358f7f;
    cursor:pointer;
  "
>
  編輯
</button>
<br>
            <div style="font-size:13px;color:#8a9690;">
              排序 ${doctor.sort_order || ''}
            </div>

            <div style="
              margin-top:6px;
              font-size:13px;
              color:${doctor.is_active ? '#358f7f' : '#d9534f'};
            ">
              ${doctor.is_active ? '顯示中' : '已隱藏'}
            </div>
          </div>

        </div>
      </div>
    `;

  }).join('');

});
async function editDoctor(id) {

  const { data: doctor, error } = await db
    .from('healthcome_doctors')
    .select('*')
    .eq('id', id)
    .single();

  if (error) {
    alert('讀取醫師資料失敗：' + error.message);
    return;
  }

  const name = prompt('醫師姓名', doctor.name || '');
  if (name === null) return;

  const title = prompt('職稱', doctor.title || '');
  if (title === null) return;

  const specialty = prompt('專科', doctor.specialty || '');
  if (specialty === null) return;

  const slogan = prompt('介紹文字', doctor.slogan || '');
  if (slogan === null) return;

  const sortOrder = prompt('排序', doctor.sort_order || '');
  if (sortOrder === null) return;

  const { error: updateError } = await db
    .from('healthcome_doctors')
    .update({
      name: name.trim(),
      title: title.trim(),
      specialty: specialty.trim(),
      slogan: slogan.trim(),
      sort_order: Number(sortOrder)
    })
    .eq('id', id);

  if (updateError) {
    alert('儲存失敗：' + updateError.message);
    return;
  }

  alert('醫師資料已儲存');

  doctorMenuButton.click();
}
checkLogin();

</script>

</body>
</html>
