<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>立康診所｜設定新密碼</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #f2f7f3;
      color: #24453d;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 18px;
      padding: 42px;
      box-shadow: 0 12px 40px rgba(36,69,61,.12);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand h1 {
      margin: 0;
      color: #358f7f;
      font-size: 30px;
      letter-spacing: 4px;
    }

    .brand p {
      margin: 10px 0 0;
      color: #82948f;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5dfdc;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #35a18d;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #358f7f;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }

    .error { color: #c44c4c; }
    .success { color: #27866f; }
  </style>
</head>

<body>

<div class="page">
  <div class="box">

    <div class="brand">
      <h1>立康診所</h1>
      <p>設定新的管理員密碼</p>
    </div>

    <form id="passwordForm">

      <label for="password">新密碼</label>
      <input
        id="password"
        type="password"
        placeholder="請輸入新密碼"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <label for="confirmPassword">再次輸入新密碼</label>
      <input
        id="confirmPassword"
        type="password"
        placeholder="請再次輸入新密碼"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button id="submitButton" type="submit">
        設定新密碼
      </button>

      <div id="message"></div>

    </form>

  </div>
</div>

<script>
const SUPABASE_URL =
  'https://utwhtjtgwryeljgwlwzm.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_207N7AlFmADOQAdTxcahEg_iVAdw4KU';

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById('passwordForm');
const button = document.getElementById('submitButton');
const message = document.getElementById('message');

form.addEventListener('submit', async function(e) {
  e.preventDefault();

  const password =
    document.getElementById('password').value;

  const confirmPassword =
    document.getElementById('confirmPassword').value;

  if (password !== confirmPassword) {
    message.textContent = '兩次輸入的密碼不一致';
    message.className = 'error';
    return;
  }

  button.disabled = true;
  button.textContent = '設定中...';

  const { error } = await db.auth.updateUser({
    password: password
  });

  if (error) {
    message.textContent =
      '設定失敗：' + error.message;
    message.className = 'error';

    button.disabled = false;
    button.textContent = '設定新密碼';
    return;
  }

  message.textContent =
    '密碼設定成功，即將前往管理後台';
  message.className = 'success';

  setTimeout(function() {
    window.location.href = 'admin.html';
  }, 1500);
});
</script>

</body>
</html>
