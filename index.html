<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="立康診所官方網站">
  <title>立康診所｜HealthCome Clinic</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #e4f0e8 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #dbeae2 0%, transparent 35%),
        #f7f5ef;
      color: #355c4d;
    }
    .container { text-align: center; padding: 60px 28px; }
    .logo {
      width: 74px; height: 74px; margin: 0 auto 28px;
      border-radius: 50%; background: #8fb6a3;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 28px; font-weight: 500;
      box-shadow: 0 8px 25px rgba(74,110,93,.15);
    }
    h1 {
      font-size: 36px; font-weight: 500; letter-spacing: 5px;
      margin-bottom: 18px; color: #315849;
    }
    .line {
      width: 45px; height: 2px; background: #b9a77b;
      margin: 0 auto 26px;
    }
    p {
      font-size: 20px; font-weight: 300; letter-spacing: 3px;
      color: #687d72;
    }
    .english {
      margin-top: 18px; font-size: 12px; letter-spacing: 3px;
      color: #a2aaa5; text-transform: uppercase;
    }
    @media (max-width: 600px) {
      h1 { font-size: 28px; letter-spacing: 3px; }
      p { font-size: 17px; line-height: 1.8; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">立</div>
    <h1>立康診所</h1>
    <div class="line"></div>
    <p>立康診所網頁即將為您服務</p>
    <div class="english">HealthCome Clinic</div>
  </main>
</body>
</html>
